{% set name = "perl-role-tiny" %}
{% set version = "2.002005" %}
{% set sha256 = "4618ec524618c104dc28a8cc86af129a00cad282aea7f4c75060ba05d4c8f4d7" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/H/HA/HAARG/Role-Tiny-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
  run:
    - perl

test:
  imports:
    - Role::Tiny
    - Role::Tiny::With

about:
  home: http://metacpan.org/pod/Role-Tiny
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file: LICENSE
  summary: 'Roles: a nouvelle cuisine portion size slice of Moose'

extra:
  recipe-maintainers:
    - xileF1337
    - cbrueffer
